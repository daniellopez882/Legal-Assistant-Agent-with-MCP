name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests
        # No credentials are provided on purpose. The suite is hermetic: a fake
        # chat model is installed session-wide in tests/conftest.py, so no test
        # can reach a real provider. Before that seam existed, six API tests
        # made live calls and failed with 401.
        env:
          ENVIRONMENT: testing
        run: pytest --no-cov -q

      - name: The suite must not make live model calls
        # Guards the property above. If the fake is removed, agents fall back to
        # real clients and the suite starts costing money.
        env:
          ENVIRONMENT: testing
        run: |
          python - <<'PY'
          import pathlib, sys
          conftest = pathlib.Path("tests/conftest.py").read_text(encoding="utf-8")
          for needle in ("set_model_factory", "autouse=True"):
              if needle not in conftest:
                  print(f"::error::tests/conftest.py no longer installs the fake model ({needle} missing)")
                  sys.exit(1)
          agents = pathlib.Path("src/agents")
          bad = [p.name for p in agents.glob("*.py")
                 if "ChatOpenAI(" in p.read_text(encoding="utf-8")
                 or "ChatAnthropic(" in p.read_text(encoding="utf-8")]
          if bad:
              print(f"::error::agents building clients directly, bypassing src.llm: {bad}")
              sys.exit(1)
          print("hermetic")
          PY

      - name: Bandit
        run: bandit -q -r src -ll

      - name: Dependency audit
        run: pip-audit --progress-spinner off

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: legal-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container boots without model credentials and serves /health
        # The previous image was built here and never run. Running it showed
        # that create_app() built every agent's model at startup, so without
        # live keys the container exited before serving anything.
        run: |
          docker run -d --name la-ci -p 8000:8000 -e API_KEY=ci-key-not-real legal-assistant:ci
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; curl -fsS http://localhost:8000/health; echo; exit 0
            fi
            sleep 1
          done
          echo "::error::container never became healthy"; docker logs la-ci; exit 1

      - name: Readiness says why it cannot serve yet
        run: |
          code=$(curl -s -o /tmp/ready.json -w "%{http_code}" http://localhost:8000/ready)
          cat /tmp/ready.json; echo
          [ "$code" = "503" ] || { echo "::error::expected 503 without model credentials, got $code"; exit 1; }
          grep -q '"llm_credentials": {"ok": false' /tmp/ready.json || python3 -c '
          import json; d = json.load(open("/tmp/ready.json")); assert d["checks"]["llm_credentials"]["ok"] is False'

      - name: Agent routes reject unauthenticated callers
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/api/v1/contract/review \
            -H 'Content-Type: application/json' -d '{}')
          echo "unauthenticated POST /api/v1/contract/review -> $code"
          [ "$code" = "401" ] || { echo "::error::agent routes are not protected"; exit 1; }

      - name: Production refuses the placeholder key
        run: |
          if docker run --rm legal-assistant:ci python -c 'from src.config import Settings; Settings(environment="production")' 2>/dev/null; then
            echo "::error::a production start with the placeholder API_KEY was accepted"; exit 1
          fi
          echo "refused, as it should be"

      - name: Image does not run as root
        run: |
          uid=$(docker run --rm --entrypoint sh legal-assistant:ci -c 'id -u')
          echo "runs as uid $uid"
          [ "$uid" != "0" ] || { echo "::error::image runs as root"; exit 1; }

      - name: Clean up
        if: always()
        run: docker rm -f la-ci || true
